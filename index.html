const calcDot=(norm,cx,cy,r)=>{const{D,I,S,C}=norm,avg=(D+I+S+C)/4,rD=D-avg,rI=I-avg,rS=S-avg,rC=C-avg,dx=rI+rS-rD-rC,dy=rS+rC-rD-rI,mV=40,sx=cx+(dx/mV)*r*0.85,sy=cy+(dy/mV)*r*0.85,dist=Math.sqrt((sx-cx)**2+(sy-cy)**2),cap=r*0.85;if(dist>cap){const f=cap/dist;return[cx+(sx-cx)*f,cy+(sy-cy)*f];}return[sx,sy];};

function VL({x,chars,cy,fs}){const lh=fs*1.45,th=(chars.length-1)*lh,sy=cy-th/2;return h('text',{textAnchor:'middle',fontSize:fs,fill:'#888',opacity:0.85,fontWeight:'500'},chars.map((c,i)=>h('tspan',{key:i,x,y:sy+i*lh},c)));}
function Wheel({normScores,highlight,allDots}){
  const cx=220,cy=220,r=138;
  const xy=(d,rad)=>{const a=d*Math.PI/180;return[cx+rad*Math.sin(a),cy-rad*Math.cos(a)];};
  const arc=(s,e,R)=>{const[x1,y1]=xy(s,R),[x2,y2]=xy(e,R),lg=(e-s)>180?1:0;return`M ${cx} ${cy} L ${x1.toFixed(1)} ${y1.toFixed(1)} A ${R} ${R} 0 ${lg} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z`;};
  const secs=[{s:270,e:300,l:'Dc',c:'#7DC4A0',b:false,t:'D'},{s:300,e:330,l:'D',c:'#5CA882',b:true,t:'D'},{s:330,e:360,l:'Di',c:'#7DC4A0',b:false,t:'D'},{s:0,e:30,l:'Id',c:'#F09070',b:false,t:'I'},{s:30,e:60,l:'I',c:'#E87055',b:true,t:'I'},{s:60,e:90,l:'Is',c:'#F09070',b:false,t:'I'},{s:90,e:120,l:'Si',c:'#6DAECB',b:false,t:'S'},{s:120,e:150,l:'S',c:'#4A9BC0',b:true,t:'S'},{s:150,e:180,l:'Sc',c:'#6DAECB',b:false,t:'S'},{s:180,e:210,l:'Cs',c:'#D4B040',b:false,t:'C'},{s:210,e:240,l:'C',c:'#C8A020',b:true,t:'C'},{s:240,e:270,l:'Cd',c:'#D4B040',b:false,t:'C'}];
  const kws=[{t:'行動',a:0},{t:'熱意',a:45},{t:'協力',a:90},{t:'支援',a:135},{t:'着実',a:180},{t:'正確',a:225},{t:'挑戦',a:270},{t:'成果',a:315}];
  const mDot=normScores?calcDot(normScores,cx,cy,r):null;
  return h('svg',{width:'100%',viewBox:'0 0 440 440',style:{maxWidth:380,display:'block',margin:'0 auto'}},
    h(VL,{x:14,chars:['タ','ス','ク','指','向'],cy:220,fs:12}),h(VL,{x:426,chars:['人','指','向'],cy:220,fs:12}),
    ...secs.map((s,i)=>h('path',{key:i,d:arc(s.s,s.e,r),fill:s.c,stroke:'white',strokeWidth:1.5,opacity:highlight&&s.t!==highlight?0.25:1})),
    ...secs.map((s,i)=>{const mid=(s.s+s.e)/2,[lx,ly]=xy(mid,r*0.73),dim=highlight&&s.t!==highlight;return h('text',{key:'sl'+i,x:lx,y:ly,textAnchor:'middle',dominantBaseline:'central',fontSize:s.b?13:10,fontWeight:s.b?'700':'400',fill:'white',opacity:dim?0.15:1},s.l);}),
    ...[{t:'D',a:315},{t:'I',a:45},{t:'S',a:135},{t:'C',a:225}].map(({t,a})=>{const[lx,ly]=xy(a,r*0.38),dim=highlight&&t!==highlight;return h('text',{key:'m'+t,x:lx,y:ly,textAnchor:'middle',dominantBaseline:'central',fontSize:38,fontWeight:'700',fill:'white',opacity:dim?0.1:0.88},t);}),
    ...kws.map((k,i)=>{const[lx,ly]=xy(k.a,170);return h('text',{key:'ok'+i,x:lx,y:ly,textAnchor:'middle',dominantBaseline:'central',fontSize:12,fontWeight:'600',fill:'#1a1a1a',opacity:0.7},k.t);}),
    h('circle',{cx,cy,r:7,fill:'white',opacity:0.2}),
    allDots&&allDots.map((d,i)=>{const[dx,dy]=calcDot(d.norm,cx,cy,r);return h('circle',{key:'ad'+i,cx:dx,cy:dy,r:7,fill:DISC[d.primaryType].color,stroke:'white',strokeWidth:1.5,opacity:0.75});}),
    mDot&&[h('circle',{key:'sh',cx:mDot[0]+2,cy:mDot[1]+2,r:12,fill:'rgba(0,0,0,0.2)'}),h('circle',{key:'d',cx:mDot[0],cy:mDot[1],r:11,fill:'#1a1a1a',stroke:'white',strokeWidth:3}),h('circle',{key:'i',cx:mDot[0],cy:mDot[1],r:4.5,fill:'white'})]
  );
}

  if(screen==='info')return h('div',{style:{maxWidth:480,margin:'0 auto',padding:'2rem 1rem'}},
    h('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:'1.5rem'}},

    h('p',{style:{color:'#666',marginBottom:'1.5rem',lineHeight:1.7}},'診断を始める前に、事業部と名前を入力してください。'),

      h('div',{style:{textAlign:'center',marginBottom:10}},h('span',{style:{background:ACCENT,color:'white',padding:'4px 18px',borderRadius:20,fontSize:13,fontWeight:600}},`Q${ps} - Q${pe}`)),

          h('div',{style:{display:'flex',alignItems:'flex-start',gap:8,marginBottom:10}},h('span',{style:{background:ACCENT,color:'white',padding:'2px 7px',borderRadius:5,fontSize:11,fontWeight:600,flexShrink:0,marginTop:2}},`Q${q.id}`),h('span',{style:{fontSize:14,lineHeight:1.6}},q.q)),
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'0 2px',marginBottom:4}},[5,4,3,2,1].map(v=>h('div',{key:v,onClick:()=>setAns(qi,v),style:{width:42,height:42,borderRadius:'50%',background:val===v?ACCENT:'#f2f2f7',border:val===v?'none':'0.5px solid #d8d8dc',cursor:'pointer',transition:'all 0.15s',flexShrink:0}}))),
          h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',fontSize:11,color:'#999',padding:'0 2px'}},h('span',null,'そう思う'),h('div',{style:{flex:1,height:'1px',background:'#d8d8dc',margin:'0 8px',position:'relative'}},h('span',{style:{position:'absolute',left:-4,top:-5,fontSize:10}},'←'),h('span',{style:{position:'absolute',right:-4,top:-5,fontSize:10}},'→')),h('span',null,'思わない'))

        h('button',{onClick:handleNext,disabled:!pageOK||saving,style:{flex:1,padding:'11px 0',background:pageOK?ACCENT:'#e8e8ec',color:pageOK?'white':'#999',border:'none',borderRadius:8,fontSize:14,fontWeight:500,cursor:pageOK&&!saving?'pointer':'not-allowed',transition:'all 0.2s'}},saving?'保存中...':(page<TP-1?'次へ →':'結果を見る →'))

  }

  return h('div',{style:{maxWidth:540,margin:'0 auto',padding:'2rem 1rem'}},
    
    h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}},
      h('div',{style:{display:'flex',alignItems:'center',gap:10}},
        h('div',{style:{width:36,height:36,borderRadius:8,background:ACCENT,display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontWeight:600,fontSize:16}},'D'),
        h('h1',{style:{margin:0,fontSize:22,fontWeight:500}},'DISC 行動特性診断')
      ),
      
    ),
    h('p',{style:{color:'#666',margin:'0 0 1.5rem',lineHeight:1.7}},'50問の質問に5段階で回答してください。「そう思う」から「思わない」の5段階で、直感的に答えてください。'),
